<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de anotações</title>
</head>
<body>
    <h2>Anotações para estudos!</h2>
    <form action="http://localhost:3000/Estudo" method="post">
        <input type="text" name="nome" placeholder="Digite seu nome!">
        <br><br>
        <textarea name="materia" placeholder="Digite o que você aprendeu hoje!" required></textarea>
        <br><br>
        <button type="submit">Enviar anotação!</button>
    </form>
</body>
</html>
