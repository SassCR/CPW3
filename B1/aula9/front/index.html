<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Velocity Motorsport</title>
  <link rel="stylesheet" href="colorir.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <h1>VELOCITY MOTORSPORT</h1>
  </header>

  <main>
    <div class="Login">
      <h2>Seja bem-vindo!</h2>
      <p>Entre para acessar nosso catálogo de veículos.</p>


      <form id="form-login" action="/solicitar-codigo" method="POST" novalidate>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">

        <p id="mensagem-login"></p>

        <button type="submit">Enviar Código</button>

      </form>

    </div>
  </main>

</body>

</html>
